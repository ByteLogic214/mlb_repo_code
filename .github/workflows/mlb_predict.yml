name: MLB Daily Predictions

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: mlb-daily-predictions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate API key
        run: |
          test -n "$ODDS_API_KEY" || {
            echo "ODDS_API_KEY no está configurada"
            exit 1
          }

      - name: Extract today's MLB data
        run: |
          python -m src.ingestion.daily_mlb \
            --date "$(date -u +%F)" \
            --output-dir data/raw/daily

      - name: Build daily features
        run: |
          python -m src.features.build_features \
            --date "$(date -u +%F)" \
            --input-dir data/raw/daily \
            --output-file data/processed/mlb_game_features.parquet

      - name: Generate predictions
        run: |
          python -m src.inference.predict_daily \
            --date "$(date -u +%F)" \
            --models-dir models \
            --features-file data/processed/mlb_game_features.parquet \
            --output-dir reports

      - name: Validate output
        run: |
          FILE="reports/predictions_$(date -u +%F).csv"
          test -s "$FILE"

          python - "$FILE" <<'PY'
          import sys
          import pandas as pd

          path = sys.argv[1]
          df = pd.read_csv(path)

          required = {
              "game_id",
              "game_date",
              "home_team",
              "away_team",
              "home_win_probability",
              "away_win_probability",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"Faltan columnas: {sorted(missing)}"
              )

          if df.empty:
              raise SystemExit(
                  "El archivo de predicciones está vacío"
              )

          for column in [
              "home_win_probability",
              "away_win_probability",
          ]:
              if not df[column].between(0, 1).all():
                  raise SystemExit(
                      f"Probabilidades inválidas en {column}"
                  )

          print(df.to_string(index=False))
          PY

      - name: Upload prediction artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-predictions-${{ github.run_id }}
          path: reports/predictions_*.csv
          if-no-files-found: error
          retention-days: 14

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/predictions_*.csv data/raw/daily/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos"
          else
            git commit -m \
              "chore: daily MLB predictions $(date -u +%F)"
            git push
          fi
